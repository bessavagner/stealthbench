<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>sannysoft-running</title>
  <style>
    body { font-family: monospace; }
    table { border-collapse: collapse; }
    td { padding: 2px 10px; border: 1px solid #ccc; }
    tr.passed  td { background: #d7f5d7; }
    tr.failed  td { background: #f5d7d7; }
    tr.errored td { background: #eee; }
  </style>
</head>
<body>
  <!--
    Sannysoft-style automation-detection panel (self-hosted, offline).

    Result-row DOM shape (consumed by detectors/sannysoft.py):
      <table id="results">
        <tr class="check passed">…</tr>   ← human/headful for this check
        <tr class="check failed">…</tr>   ← automation/headless signal detected
        <tr class="check errored">…</tr>  ← check threw; EXCLUDED from counts (a gap)
      </table>
    Readiness: window.__SANNYSOFT_DONE__ === true once every check has rendered.
    The detector reduces these rows to integer counts {passed, failed, total} in-browser.

    Panel logic + attribution live in ./sannysoft/sannysoft.checks.js (MIT, see its LICENSE).
  -->
  <h1 id="status">running</h1>
  <table id="results"></table>
  <script src="./sannysoft/sannysoft.checks.js"></script>
</body>
</html>
