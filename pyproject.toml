[project]
name = "stealthbench"
version = "0.0.1"
description = "A reproducible benchmark that puts numbers on browser-automation stealth."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "selenium>=4.20",
    "selenium-stealth>=1.0.6",
    "undetected-chromedriver>=3.5.5",
    "setuptools>=69",            # undetected-chromedriver imports pkg_resources
    "pydantic>=2.7",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
